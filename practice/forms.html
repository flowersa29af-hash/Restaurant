<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Forms</h1>
    <form action="" method="post"><!-- Handle form submission-->

        <label for="fname">First Name:</label>
        <input type="text" id="fname">

        <label for="lname">LastName:</label>
        <input type="text" id="lname">

        <input type="submit" value="Submit">  
    </form>

    <p>Select the option that applies to you:</p>

    <form>
        <input type="checkbox" id="vehicle1" name="vehicle1" value="bike">
        <label for="vehicle1">I have a bike</label>

        <input type="checkbox" id="vehicle2" name="vehicle2" value="car">
        <label for="vehicle2">I have a car</label>

        <input type="checkbox" id="vehicle3" name="vehicle3" value="boat">
        <label for="vehicle3">I have a boat</label>

        <input type="submit" value="Submit">
    </form>

    <p>Elements inside of a form</p>
    <form>
        <fieldset>
            <legend>Contact Information:</legend>
            <label>First name</label>
            <input type="text" id="fname">
        </fieldset>

        <fieldset>
            <legend>Vehicles Options:</legend>
            <label for="cars">I have a car:</label>
            <select id="cars" name="cars">
                <option value="volvo">Volvo</option>
                <option value="saab">Saab</option>
                <option value="mercedes">Mercedes</option>
                <option value="audi">Audi</option>
            </select>
        </fieldset>
        <fieldset>
            <legend>Body</legend>
                <label>Leave a message:</label>
                <textarea name="message" rows="10" cols="80" placeholder="Enter your message here..."></textarea>
        </fieldset>

        <fieldset>
            <legend>Input Type</legend>
            <label>Password</label>
            <input type="password" id="password" maxlenth="6">
            <br>
            <label>color</label>
            <input type="color" id="color">
            <br>
            <label>Date</label>
            <input type="date" id="date">
            <br>
            <label>email</label>
            <input type="email" id="email">
            <br>
            <label>file</label>
            <input type="file" id="file">
            <br>
            <label>number</label>
            <input type="number" id="number">



        </fieldset>

        <input type="submit" value="Submit">

    </form>
    
</body>
</html>
