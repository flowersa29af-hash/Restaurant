<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="practice-layout.css">
    <title>Document</title>
</head>
<body>
    <h1>flexbox</h1>

    <h2>flex-start</h2>
    <div class="container-flex-start">
        <p>child-1</p>
        <p>child-2</p>       
    
    </div>

    <h2>flex-end</h2>
    <div class="container-flex-end">
        <p>child-1</p>
        <p>child-2</p>       
    
    </div>

    <h2>center</h2>
    <div class="container-center">
        <p>child-1</p>
        <p>child-2</p>       
    
    </div>
    <h2>space-between</h2>
    <div class="container-space-between">
        <p>child-1</p>
        <p>child-2</p>       
    
    </div>
    <h2>space-around</h2>
    <div class="container-space-around">
        <p>child-1</p>
        <p>child-2</p>       
    
    </div>
    <h2>space-evenly</h2>
    <div class="container-space-evenly">
        <p>child-1</p>
        <p>child-2</p>       
    </div>

    

    <h1>Grid</h1>

    <section class="grid-container">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
    </section>
    
</body>
</html>
