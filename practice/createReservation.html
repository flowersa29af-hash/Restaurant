<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forms.css">
    <title>Create Reservation</title>
</head>
<body>
    <header class="site-init">
        <h1>Salads 'R' Us</h1>
        <nav class="navigation">
            <a href="../index.html">Home</a>
            <a href="reservations.html">Reservations</a>
            <a href="createReservation.html">Create Reservation</a>
        </nav>
    </header>
    <main>
        <div class="reservation-wrapper">
            <div class="reservation-header">
                <h2>Reserve your table</h2>
                <p>Fill out the form below to reserve your table.</p>
            </div>
            <form class="reservation-form">
                <!-- Date, Time, Guest Name, Party Size, Status. -->
                <div class="input-group">
                    <label>Date</label>
                    <input type="date">
                </div>

                <div class="input-group">
                    <label>Time:</label>
                    <input type="time">
                </div>

                <div class="input-group">
                    <label>Guest name:</label>
                    <input type="text">
                </div>

                <div class="input-group">
                    <label>Party size:</label>
                    <input type="number">
                </div>

                <div class="input-group">
                    <label>Status</label>
                    <select name="status" id="status">
                        <option value="" disabled selected> --- Select one status --- </option>
                        <option value="confirm">Confirm</option>
                        <option value="pending">Pending</option>
                        <option value="cancel">Cancel</option>
                    </select>
                </div>
           <div>
                <button type="submit" class="submit-button">Submit</button>
            </div>     
            </form>
            <form class="payment-form">
                <h3 class="form-title">Payment Information</h3>
                <div class="input-group">
                    <label>Cardholder Name:</label>
                    <input type="text" placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label>Card Number:</label>
                    <input type="text" placeholder="Enter your card number">
                </div>

                <div class="input-group">
                    <label>Expiration Date:</label>
                    <input type="text" placeholder="MM/YY">
                </div>

                <div class="input-group">
                    <label>CVV:</label>
                    <input type="text" placeholder="Enter CVV">
                </div>

                <div >
                    <button type="submit" class="submit-button">Submit Payment</button>
                </div>




            </form>
            
        </div>
    </main> 
    
</body>
</html>
